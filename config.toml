# Sticker Factory Configuration
# This file contains application settings (non-sensitive)
# API keys should be in .streamlit/secrets.toml

[app]
title = "✨ Stikka Centraal ✨"
privacy_mode = true
debug_mode = false
enable_comfy = true

[ui]
history_limit = 15
items_per_page = 5

[txt2img]
# URL for Stable Diffusion API endpoint
url = "http://localhost:7860"

[comfy]
# URL for Comfy AI API endpoint
url = "https://ai.stikka.art"
# Polling interval in seconds for checking workflow status
poll_interval = 1

[logging]
file = false
file_level = "WARNING"
stdout = true
stdout_level = "DEBUG"

[tabs]
# Enable or disable tabs by setting them to true or false
# Order in this list determines tab order in the app
enabled = [
    "Sticker",
    "Sticker Pro",
    "Tiling",
    "Label",
    "Text2image",
    "Webcam",
    "Cat",
    "Dog",
    "History",
    "Stats",
    "FAQ",
]

[fallback]
models = [
    "QL-570"
]
label = 62

[media]
# What paper is loaded in each printer, so users can see it before they print.
# These models can't report their media, so it has to be stated here.
# Key by the name shown in the UI ("<model> - <last 4 of the serial>") or by
# the serial number itself. Anything not listed shows as "not configured".
"QL-570 - 9037" = "transparent"
"QL-500 - 8169" = "white"

[receipt]
# Prints a small receipt on an ESC/POS thermal printer after every sticker.
# Set up for the Epson TM-T20III (labelled M267D) at 04b8:0e28. TOML has no
# hex literals, so the ids are strings.
enabled = true
vendor_id = "0x04b8"
product_id = "0x0e28"
# 576 dots = 72mm printable on 80mm paper; use 384 for a 58mm roll.
width_dots = 576
# Cap on the sticker preview. Vertical labels can be a metre long, which
# scaled to the full receipt width would eat a lot of paper.
max_image_dots = 480
show_image = true
header = "STIKKA CENTRAAL"
footer = "Kleben und kleben lassen"
feed_lines = 2
cut = true
timeout_ms = 5000
